<!doctype html>
<html><head><meta charset="utf-8"><title>Samaat logo concepts</title>
<style>
  body{margin:0;padding:32px;background:#0B0D10;color:#E6E9EC;font:15px system-ui,sans-serif}
  h2{margin:0 0 4px;font-size:18px} p{margin:0 0 16px;color:#8A939C}
  .row{display:flex;align-items:flex-end;gap:28px;padding:24px;margin-bottom:12px;border:1px solid #23282E;border-radius:14px}
  .light{background:#F2F4F6;margin-bottom:32px}
  svg{display:block}
</style></head><body>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#20252B"/><stop offset="1" stop-color="#0B0D10"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3A414A"/><stop offset="1" stop-color="#15181C"/></linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E4FF8F"/><stop offset=".55" stop-color="#C8F169"/><stop offset="1" stop-color="#7FC21F"/></linearGradient>
    <linearGradient id="bud" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#737C87"/><stop offset="1" stop-color="#24282E"/></linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3"/></filter>

    <!-- shared glossy dark tile -->
    <g id="base">
      <rect x="1" y="1" width="98" height="98" rx="23" fill="url(#tile)" stroke="url(#edge)" stroke-width="1.5"/>
      <circle cx="50" cy="50" r="38" fill="none" stroke="#C8F169" stroke-opacity=".05" stroke-width="1"/>
    </g>
    <!-- one earbud: head + stem, lime accent; mirrored for the right side -->
    <g id="budL">
      <path d="M40 38 a11 11 0 1 1 -1 21 v13 a4 4 0 0 1 -8 0 v-22 a12 12 0 0 1 9 -12z" fill="url(#bud)" stroke="#5A626C" stroke-width=".8"/>
      <rect x="42.5" y="44" width="2.6" height="7" rx="1.3" fill="#C8F169"/>
    </g>

    <!-- 1 · Bold S -->
    <symbol id="i1" viewBox="0 0 100 100">
      <use href="#base"/>
      <path id="bs" d="M69 33 H44 a8.5 8.5 0 0 0 0 17 H56 a8.5 8.5 0 0 1 0 17 H31" fill="none" stroke="#C8F169" stroke-width="14" filter="url(#glow)" opacity=".55"/>
      <path d="M69 33 H44 a8.5 8.5 0 0 0 0 17 H56 a8.5 8.5 0 0 1 0 17 H31" fill="none" stroke="url(#lime)" stroke-width="14"/>
    </symbol>

    <!-- 2 · Buds in battery ring -->
    <symbol id="i2" viewBox="0 0 100 100">
      <use href="#base"/>
      <circle cx="50" cy="50" r="33" fill="none" stroke="#2A3037" stroke-width="5"/>
      <circle cx="50" cy="50" r="33" fill="none" stroke="#C8F169" stroke-width="5" stroke-linecap="round" stroke-dasharray="145 210" transform="rotate(-90 50 50)" filter="url(#glow)" opacity=".7"/>
      <circle cx="50" cy="50" r="33" fill="none" stroke="url(#lime)" stroke-width="5" stroke-linecap="round" stroke-dasharray="145 210" transform="rotate(-90 50 50)"/>
      <g transform="translate(50 50) scale(.8) translate(-56 -55)"><use href="#budL" transform="translate(85 0) scale(-1 1)"/><use href="#budL" transform="translate(27 0)"/></g>
    </symbol>

    <!-- 3 · Arc over buds -->
    <symbol id="i3" viewBox="0 0 100 100">
      <use href="#base"/>
      <path d="M19 62 A31 31 0 0 1 81 62" fill="none" stroke="#C8F169" stroke-width="6" stroke-linecap="round" filter="url(#glow)" opacity=".7"/>
      <path d="M19 62 A31 31 0 0 1 81 62" fill="none" stroke="url(#lime)" stroke-width="6" stroke-linecap="round"/>
      <g transform="translate(50 56) scale(.85) translate(-56 -55)"><use href="#budL" transform="translate(85 0) scale(-1 1)"/><use href="#budL" transform="translate(27 0)"/></g>
    </symbol>
  </defs>
</svg>

<h2>1 · Bold S</h2><p>Chunky lime S with a soft glow. Cleanest at 16px and doubles as the wordmark badge.</p>
<div class="row"><svg width="256" height="256"><use href="#i1"/></svg><svg width="64" height="64"><use href="#i1"/></svg><svg width="32" height="32"><use href="#i1"/></svg><svg width="16" height="16"><use href="#i1"/></svg></div>
<div class="row light"><svg width="64" height="64"><use href="#i1"/></svg><svg width="32" height="32"><use href="#i1"/></svg><svg width="16" height="16"><use href="#i1"/></svg></div>

<h2>2 · Buds in ring</h2><p>Earbuds inside the battery ring from the Overview screen. Says what the app does.</p>
<div class="row"><svg width="256" height="256"><use href="#i2"/></svg><svg width="64" height="64"><use href="#i2"/></svg><svg width="32" height="32"><use href="#i2"/></svg><svg width="16" height="16"><use href="#i2"/></svg></div>
<div class="row light"><svg width="64" height="64"><use href="#i2"/></svg><svg width="32" height="32"><use href="#i2"/></svg><svg width="16" height="16"><use href="#i2"/></svg></div>

<h2>3 · Arc over buds</h2><p>A lime arc over two earbuds, like a sound halo.</p>
<div class="row"><svg width="256" height="256"><use href="#i3"/></svg><svg width="64" height="64"><use href="#i3"/></svg><svg width="32" height="32"><use href="#i3"/></svg><svg width="16" height="16"><use href="#i3"/></svg></div>
<div class="row light"><svg width="64" height="64"><use href="#i3"/></svg><svg width="32" height="32"><use href="#i3"/></svg><svg width="16" height="16"><use href="#i3"/></svg></div>

</body></html>
