name: CI

on:
  push:
    # master holds releases; feature/ui-redesign is the integration branch (dev) for now. Keep "dev" listed so
    # CI keeps running if the branch is renamed. Work branches are covered by pull_request.
    branches: [master, feature/ui-redesign, dev]
  pull_request:
  # "Run workflow" on the Actions tab, e.g. to build a fresh APK.
  workflow_dispatch:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build Samaat.slnx -c Release
      - run: dotnet test Samaat.slnx -c Release --no-build
        env:
          SAMAAT_SCREENSHOTS: ${{ github.workspace }}/artifacts/screenshots
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: screenshots
          path: artifacts/screenshots

