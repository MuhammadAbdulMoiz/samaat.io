name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build Samaat.slnx -c Release
      - run: dotnet test Samaat.slnx -c Release --no-build
        env:
          SAMAAT_SCREENSHOTS: ${{ github.workspace }}/artifacts/screenshots
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: screenshots
          path: artifacts/screenshots
