name: CI

on:
  push:
    # master holds releases; dev is the integration branch. Work branches are covered by pull_request.
    branches: [master, dev]
  pull_request:
  # "Run workflow" on the Actions tab, e.g. to build a fresh APK.
  workflow_dispatch:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build Samaat.slnx -c Release
      # tests/Samaat.Platform.Windows.Tests is a test project on Windows only (IsTestProject), so it runs on windows-latest
      # and is built, not run, on ubuntu-latest.
      - run: dotnet test Samaat.slnx -c Release --no-build --collect "XPlat Code Coverage" --results-directory artifacts/coverage
        env:
          SAMAAT_SCREENSHOTS: ${{ github.workspace }}/artifacts/screenshots
      - name: Coverage summary
        if: always()
        run: python .github/scripts/coverage-summary.py artifacts/coverage artifacts/coverage/summary.md
      - name: Coverage in the job summary
        if: always()
        shell: bash
        run: cat artifacts/coverage/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.os }}
          path: |
            artifacts/coverage/summary.md
            artifacts/coverage/**/coverage.cobertura.xml
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: screenshots
          path: artifacts/screenshots

